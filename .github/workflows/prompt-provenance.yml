name: Prompt Provenance

on:
  pull_request:

permissions:
  contents: read

jobs:
  prompt-provenance:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Check prompt provenance
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/check_prompt_provenance.py --mode diff --base-ref "$BASE_REF"
