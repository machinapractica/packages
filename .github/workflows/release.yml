name: Experimental package release
on:
  workflow_dispatch:
    inputs:
      package:
        description: Independently versioned package
        type: choice
        options: [testing, build-info]
        required: true
      publish:
        description: Publish verified alpha through configured npm trusted publishing
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: npm-${{ inputs.package }}
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    environment: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
      - run: npm install --global npm@11.16.0
      - run: npm ci --ignore-scripts && npx --no-install playwright install-deps chromium
      - run: ./scripts/verify.sh
      - name: Publish or dry-run exactly the verified tarball
        env:
          RELEASE_PACKAGE: ${{ inputs.package }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: node scripts/release.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: release-evidence-${{ inputs.package }}-${{ github.sha }}
          path: |
            evidence/
            test-results/
            playwright-report/
            .artifacts/
          include-hidden-files: true
          retention-days: 30
